services:
  - type: web
    name: painel-eleitoral-api
    env: node
    plan: free
    region: oregon
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LGPD_AUDIT_SECRET
        sync: false
