name: Free-Tier Keep Alive

on:
  schedule:
    # Executa a cada 10 minutos para evitar hibernação das instâncias gratuitas
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Backend
        run: |
          if [ -n "${{ secrets.API_HEALTHCHECK_URL }}" ]; then
            echo "Enviando ping para API: ${{ secrets.API_HEALTHCHECK_URL }}"
            curl -s -f -m 15 "${{ secrets.API_HEALTHCHECK_URL }}" || echo "Aviso: Falha temporária no ping"
          else
            echo "API_HEALTHCHECK_URL não configurada nos segredos do repositório."
          fi

      - name: Ping Supabase PgBouncer / App Web
        run: |
          if [ -n "${{ secrets.WEB_URL }}" ]; then
            echo "Enviando ping para Web App: ${{ secrets.WEB_URL }}"
            curl -s -f -m 15 "${{ secrets.WEB_URL }}" || echo "Aviso: Falha temporária no ping"
          fi
