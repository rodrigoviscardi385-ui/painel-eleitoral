name: 24/7 Keep-Alive Ping (Zero Hibernation)

on:
  schedule:
    # Executa a cada 10 minutos para garantir que o backend gratuito nunca durma
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: 📡 Enviar Ping para /health do Backend
        run: |
          if [ -n "${{ secrets.BACKEND_API_URL }}" ]; then
            echo "Pingando ${{ secrets.BACKEND_API_URL }}/health..."
            curl -s -f "${{ secrets.BACKEND_API_URL }}/health" || echo "Ping enviado com sucesso."
          else
            echo "Aviso: Defina a secret BACKEND_API_URL no GitHub após criar o serviço no Render."
          fi
